# TF-M config
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# General
CONFIG_FPU=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SNTP=n
CONFIG_REBOOT=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x8000
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMD_BUFF_SIZE=256

# GNSS sample
CONFIG_GNSS_SAMPLE_ASSISTANCE_NRF_CLOUD=n

# LTE Link Control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_NBIOT_GPS=y
CONFIG_LTE_MODE_PREFERENCE_AUTO=y
CONFIG_LTE_LC_SYSTEM_MODE_MODULE=y
CONFIG_LTE_LC_FUNCTIONAL_MODE_MODULE=y
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_APN="internet.m2mportal.de"
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4V6=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
# PSM requested periodic TAU 8 hours
CONFIG_LTE_PSM_REQ_RPTAU="00101000"
# PSM requested active time 6 seconds
CONFIG_LTE_PSM_REQ_RAT="00000011"

# The USB VCOM is used by the Zephyr shell for local test commands such as
# `ble_send`.  Keep direct nrf_modem_at_cmd() calls available to the app, but
# do not attach the AT host input handler to this same UART.
CONFIG_AT_HOST_LIBRARY=n

# External serial bridge to the 4WD board Bluetooth module.
CONFIG_GNSS_SAMPLE_UART_BRIDGE_ENABLED=y
CONFIG_GNSS_SAMPLE_CONSOLE_OUTPUT_ENABLED=y
CONFIG_GNSS_SAMPLE_GNSS_ENABLED=y
CONFIG_GNSS_SAMPLE_UART_BRIDGE_STREAM_RATE_HZ=1

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
# Disable native network stack to save some memory
CONFIG_NET_NATIVE=n

# NB-IoT MQTT telemetry transport.
CONFIG_GNSS_SAMPLE_MQTT_NBIOT_ENABLED=n
CONFIG_GNSS_SAMPLE_MQTT_APN="internet.m2mportal.de"
CONFIG_GNSS_SAMPLE_MQTT_BROKER_HOSTNAME="broker.hivemq.com"
CONFIG_GNSS_SAMPLE_MQTT_BROKER_PORT=1883
CONFIG_GNSS_SAMPLE_MQTT_TLS_ENABLED=n
CONFIG_GNSS_SAMPLE_MQTT_BROKER_FALLBACK_ENABLED=n
CONFIG_GNSS_SAMPLE_MQTT_CLIENT_ID="nrf9151-001"
CONFIG_GNSS_SAMPLE_MQTT_USERNAME=""
CONFIG_GNSS_SAMPLE_MQTT_PASSWORD=""
CONFIG_GNSS_SAMPLE_MQTT_DEVICE_ID="nrf9151-001"
CONFIG_GNSS_SAMPLE_MQTT_TOPIC="devices/nrf9151-001/config-sync-unused"
CONFIG_GNSS_SAMPLE_MQTT_RETAIN_MESSAGES=n
CONFIG_GNSS_SAMPLE_MQTT_PUBLISH_INTERVAL_SECONDS=600
CONFIG_GNSS_SAMPLE_MQTT_RETRY_BACKOFF_SECONDS=60
CONFIG_MQTT_KEEPALIVE=120

# Hybrid low-data defaults.
CONFIG_GNSS_SAMPLE_TELEMETRY_SERVER_HOST=""
CONFIG_GNSS_SAMPLE_TELEMETRY_SERVER_PORT=9000
CONFIG_GNSS_SAMPLE_TELEMETRY_PROTOCOL="udp"
CONFIG_GNSS_SAMPLE_TELEMETRY_PUBLISH_INTERVAL_SECONDS=600
CONFIG_GNSS_SAMPLE_GNSS_TIMEOUT_SECONDS=60
CONFIG_GNSS_SAMPLE_DATA_MODE_DEFAULT="auto"
CONFIG_GNSS_SAMPLE_TN_ENABLED_DEFAULT=y
CONFIG_GNSS_SAMPLE_NTN_ENABLED_DEFAULT=y
CONFIG_GNSS_SAMPLE_TN_UNAVAILABLE_TIMEOUT_SECONDS=300
CONFIG_GNSS_SAMPLE_NTN_MIN_SEND_INTERVAL_SECONDS=3600
CONFIG_GNSS_SAMPLE_NTN_MAX_PAYLOAD_BYTES_DEFAULT=200
CONFIG_GNSS_SAMPLE_MONTHLY_NTN_BYTE_LIMIT_DEFAULT=50000
CONFIG_GNSS_SAMPLE_CONFIG_VERSION_DEFAULT=1
CONFIG_GNSS_SAMPLE_AUTH_TOKEN_DEFAULT=""
CONFIG_GNSS_SAMPLE_MAX_PAYLOAD_BYTES_DEFAULT=300
CONFIG_GNSS_SAMPLE_ENABLE_DEBUG_LOGS_DEFAULT=n
CONFIG_GNSS_SAMPLE_MQTT_SYNC_ENABLED=n
CONFIG_GNSS_SAMPLE_MQTT_SYNC_INTERVAL_SECONDS=21600
CONFIG_GNSS_SAMPLE_MQTT_SYNC_FORCE_IN_NTN=n
CONFIG_GNSS_SAMPLE_TELEMETRY_BACKOFF_BASE_SECONDS=60
CONFIG_GNSS_SAMPLE_TELEMETRY_BACKOFF_MAX_SECONDS=3600

# OpenCellID/cellular resolver fallback removed.
CONFIG_GNSS_SAMPLE_CELLULAR_FALLBACK_ENABLED=n

# Memory and stack configuration
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
