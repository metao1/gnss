#
# BLE streaming overlay for BLE-capable Nordic boards.
# Example:
# west build -b nrf52840dk/nrf52840 -- -DEXTRA_CONF_FILE=overlay-ble.conf
#

CONFIG_GNSS_SAMPLE_BLE_ENABLED=y
CONFIG_GNSS_SAMPLE_BLE_DEVICE_NAME="GNSS-DK"
CONFIG_GNSS_SAMPLE_BLE_STREAM_RATE_HZ=1
CONFIG_GNSS_SAMPLE_BLE_TX_QUEUE_LEN=8

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_BT_SMP=y
CONFIG_BT_SIGNING=n
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_CTLR_PHY_2M=n
